version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: physicians_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: physicians_db
    ports:
      # Host port 5433 -> Container port 5432 (avoids conflict with default 5432)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d physicians_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: physicians_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5050
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/physicians_db
    ports:
      - "5050:5050"

volumes:
  pgdata:
